server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: eeip
  lifecycle:
    timeout-per-shutdown-phase: 20s

  datasource:
    url: jdbc:postgresql://localhost:5432/eeip
    username: eeip
    password: eeip123
    hikari:
      maximum-pool-size: 16
      minimum-idle: 4
      connection-timeout: 3000

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: localhost
      port: 6379
      password: eeip123
      timeout: 3s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8

  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: true
      logic-not-delete-value: false

eeip:
  jwt:
    # 生产环境必须通过环境变量 EEIP_JWT_SECRET 覆盖
    secret: ${EEIP_JWT_SECRET:eeip-dev-only-secret-please-change-0123456789}
    expire-seconds: 7200
    issuer: eeip
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173
  # 调度器：定时触发流程
  scheduler:
    enabled: true
    interval-ms: 5000          # 扫描间隔
    initial-delay-ms: 15000    # 启动后延迟，避开初始化
    batch-size: 20             # 单次最多处理多少个到期触发器

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.eeip: INFO
    org.flywaydb: INFO

