services:
  postgres:
    image: postgres:16-alpine
    container_name: eeip-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: eeip
      POSTGRES_USER: eeip
      POSTGRES_PASSWORD: eeip123
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eeip -d eeip"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: eeip-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "eeip123"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "eeip123", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  adminer:
    image: adminer:4
    container_name: eeip-adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "8088:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
