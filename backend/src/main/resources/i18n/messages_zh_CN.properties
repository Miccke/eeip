# ============================================================================
# 简体中文（默认）
# key 与 ErrorCode 枚举名一致，便于直接按错误码取文案
# ============================================================================
GW_400_BAD_REQUEST=请求参数不合法
GW_404_NOT_FOUND=资源不存在
GW_409_CONFLICT=资源冲突
AUTH_401_UNAUTHORIZED=未认证或凭证无效
AUTH_401_TOKEN_EXPIRED=登录已失效，请重新登录
AUTH_401_BAD_CREDENTIALS=用户名或密码错误
AUTH_401_TENANT_NOT_FOUND=租户不存在
AUTH_403_ACCOUNT_DISABLED=账号已停用
AUTH_403_FORBIDDEN=无访问权限
AUTH_403_TENANT_DISABLED=租户已停用
AUTH_403_TENANT_EXPIRED=租户已到期
SYS_409_USERNAME_EXISTS=用户名已存在
SYS_409_ROLE_IN_USE=角色已分配给用户，无法删除
SYS_422_BUILTIN_ROLE=内置角色不允许修改或删除
SYS_422_LAST_ADMIN=至少保留一个可用的超级管理员
SYS_500_INTERNAL_ERROR=系统内部错误

# 校验提示
validation.username.required=用户名不能为空
validation.password.required=密码不能为空
validation.password.size=密码长度需 8-64 位
validation.nickname.required=姓名不能为空
validation.role.code.required=角色编码不能为空
validation.role.name.required=角色名称不能为空
validation.tenant.code.required=租户编码不能为空
validation.tenant.name.required=租户名称不能为空
validation.conn.code.required=连接编码不能为空
validation.conn.name.required=连接名称不能为空
validation.conn.endpoint.required=目标地址不能为空
validation.username.pattern=用户名需以字母开头，3-32 位字母/数字/下划线
validation.email.invalid=邮箱格式不正确
validation.code.pattern=编码需为大写字母开头的大写下划线串
validation.conn.code.pattern=编码需小写字母开头，可含数字与下划线
validation.endpoint.pattern=地址需以 http:// 或 https:// 开头
validation.perm.required=权限列表不能为 null
